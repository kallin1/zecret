name: CI/CD

# CI(test → build) 는 항상 돈다. CD(deploy)는 EC2_HOST 시크릿이 아직 없으면 조용히 스킵되고,
# GitHub Secrets에 EC2_HOST/EC2_USER/EC2_SSH_KEY를 추가하는 즉시 다음 main push부터 자동 활성화된다.
# 필요한 시크릿·서버 사전 준비물은 README.md의 "CI/CD 배포" 절 참고.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.10" 
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        # scripts/, tests/에 __init__.py가 없어 네임스페이스 패키지로 import되는데, bare `pytest`는
        # 저장소 루트를 sys.path에 안 넣어 `scripts` 모듈을 못 찾는다. `python -m pytest`는 현재
        # 디렉터리를 sys.path[0]에 자동으로 넣어주므로 이 문제가 없다.
        run: python -m pytest -q

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        # src/db/ciphertext_cache.db · src/he/public_context.bin은 이제 저장소에 커밋된
        # 고정 산출물이라 checkout만으로 준비된다 — CI가 빌드마다 새로 만들지 않는다.
        # 새로 만들면 EC2에 1회 배치해 둔 비밀키(scripts/keys/)와 짝이 어긋나 군사시설
        # 판정이 전부 복호화 실패로 깨진다. 키를 실제로 교체할 땐 로컬에서
        # `python scripts/generate_mock_ciphertexts.py --force`를 수동으로 돌려 두
        # 산출물을 다시 커밋하고, scripts/keys/도 EC2에 새로 scp해야 한다.

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read # EC2에서 GITHUB_TOKEN으로 ghcr.io private 이미지를 pull하기 위함
    steps:
      - name: Check EC2 secret
        # secrets 컨텍스트는 if: 표현식 안에서 직접 참조할 수 없다(job/step 레벨 모두) — run:에서
        # 값을 읽어 output으로 내보낸 뒤, 그 output으로 다음 스텝의 if:를 건다.
        id: check
        run: |
          if [ -n "${{ secrets.EC2_HOST }}" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to EC2 over SSH
        # EC2_HOST가 비어 있으면(서버 미생성) 실패가 아니라 스킵된다 — 시크릿 등록 후 재실행하면 그대로 배포로 이어진다.
        if: steps.check.outputs.should_deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "${{ env.IMAGE }}:latest"
            docker stop zecret 2>/dev/null || true
            docker rm zecret 2>/dev/null || true
            # 서버에 미리 준비해 둔 프로덕션 .env(CLOVASTUDIO_API_KEY/VWORLD_API_KEY 등)를 그대로 주입한다.
            # /opt/zecret/keys(관리기관 비밀키, scp로 1회 배치)는 이미지에는 절대 넣지 않고
            # 볼륨으로만 마운트한다 — authority_verify_node가 호출하는
            # scripts/mock_authority_verify.py가 컨테이너 안에서 이 경로를 읽는다.
            docker run -d --name zecret --restart unless-stopped \
              -p 8501:8501 --env-file /opt/zecret/.env \
              -v /opt/zecret/keys:/app/scripts/keys:ro \
              "${{ env.IMAGE }}:latest"
